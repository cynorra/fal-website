name: Daily rebuild
# The site is a static export; this refreshes time-dependent pages (Moon transit, weekly and monthly horoscopes).
on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC every day
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
